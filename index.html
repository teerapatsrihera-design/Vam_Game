<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shape Survivor</title>
<style>
  :root{--bg:#12141c;--panel:#1d2130;--line:#2e3450;--text:#e8ebf5;--accent:#ffd447;--mute:#8d93ad}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:'Segoe UI',Tahoma,'Noto Sans Thai',sans-serif;touch-action:none;user-select:none}
  canvas{display:block;position:fixed;inset:0}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,12,20,.78);z-index:10;padding:16px}
  .overlay.show{display:flex}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:24px 28px;
    max-width:560px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  h1{margin:0 0 6px;font-size:34px;letter-spacing:1px;color:var(--accent)}
  h2{margin:0 0 12px;font-size:26px}
  p{margin:6px 0;color:var(--mute);line-height:1.5;font-size:15px}
  .btn{margin-top:16px;background:var(--accent);color:#1a1a1a;border:0;border-radius:10px;
    padding:12px 28px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
  .choices{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .choice{flex:1 1 150px;min-width:150px;background:#252a40;border:2px solid var(--line);border-radius:12px;
    padding:14px 10px;cursor:pointer;color:var(--text);font-family:inherit;transition:.12s}
  .choice:hover{border-color:var(--accent);transform:translateY(-3px)}
  .choice .ic{font-size:34px;line-height:1.1}
  .choice .nm{font-weight:700;margin-top:6px}
  .choice .lv{font-size:12px;color:var(--accent);margin-top:2px}
  .choice .ds{font-size:13px;color:var(--mute);margin-top:6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:12px auto 0;max-width:300px;text-align:left}
  .stats b{color:var(--accent);text-align:right}
  .stats div{display:flex;justify-content:space-between;gap:10px}
  kbd{background:#2a3050;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:13px;color:var(--text)}
  #muteBtn{position:fixed;right:10px;bottom:10px;z-index:5;background:rgba(29,33,48,.8);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="muteBtn">🔊</button>

<div class="overlay show" id="menu">
  <div class="card">
    <h1>SHAPE SURVIVOR</h1>
    <p>เอาชีวิตรอดจากฝูงรูปทรงให้ครบ 10 นาที</p>
    <p>เดิน: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> หรือ ลูกศร · มือถือ: แตะค้างแล้วลากหน้าจอ<br>
       อาวุธยิงอัตโนมัติ · เก็บ ◆ เพื่อเลเวลอัป · หยุดเกม: <kbd>P</kbd> / <kbd>Esc</kbd></p>
    <p id="bestTxt"></p>
    <button class="btn" id="startBtn">เริ่มเกม</button>
  </div>
</div>

<div class="overlay" id="levelup">
  <div class="card">
    <h2>⬆ เลเวลอัป!</h2>
    <p>เลือก 1 อย่าง (กดปุ่ม <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> ได้)</p>
    <div class="choices" id="choices"></div>
  </div>
</div>

<div class="overlay" id="pause">
  <div class="card">
    <h2>พักเกม</h2>
    <button class="btn" id="resumeBtn">เล่นต่อ</button>
    <button class="btn ghost" id="quitBtn">ออกไปเมนู</button>
  </div>
</div>

<div class="overlay" id="end">
  <div class="card">
    <h2 id="endTitle">จบเกม</h2>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">เล่นอีกครั้ง</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtTime = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function poly(x, y, r, n, rot = 0){
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    const a = rot + i / n * Math.PI * 2;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

/* ---------- audio (WebAudio, เสียงสังเคราะห์) ---------- */
let AC = null, muted = false, lastSnd = {};
function beep(freq, dur, type = 'square', vol = 0.05, key = 'x', gap = 0.05){
  if (muted) return;
  const now = performance.now() / 1000;
  if (lastSnd[key] && now - lastSnd[key] < gap) return;
  lastSnd[key] = now;
  try{
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
$('muteBtn').onclick = () => { muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; };

/* ---------- ข้อมูลอาวุธ / อัปเกรด ---------- */
const MAXLV = 5;
const WEAPONS = {
  wand:  { name:'ไม้เวท',   ic:'✦', color:'#6ee7ff', ds:'ยิงกระสุนใส่ศัตรูที่ใกล้สุด · เลเวลสูง: กระสุนเยอะขึ้น ยิงเร็วขึ้น' },
  orbit: { name:'ใบมีดหมุน', ic:'◈', color:'#c4f27a', ds:'ใบมีดหมุนรอบตัว · เลเวลสูง: จำนวนและความเร็วเพิ่ม' },
  aura:  { name:'ออร่า',     ic:'◎', color:'#ff8fd0', ds:'วงรังสีทำดาเมจรอบตัวต่อเนื่อง · เลเวลสูง: วงกว้างขึ้น' },
  axe:   { name:'ขวานโยน',   ic:'▲', color:'#ffb347', ds:'ขวานโค้งขึ้นฟ้าทะลุศัตรู · เลเวลสูง: จำนวนและดาเมจเพิ่ม' },
};
const PASSIVES = {
  might:  { name:'พลังโจมตี',  ic:'⚔', ds:'ดาเมจทุกอาวุธ +15%' },
  speed:  { name:'ความเร็ว',   ic:'»', ds:'เดินเร็วขึ้น +10%' },
  cdr:    { name:'คูลดาวน์',   ic:'⟳', ds:'อาวุธโจมตีถี่ขึ้น -8%' },
  hp:     { name:'พลังชีวิต',  ic:'♥', ds:'HP สูงสุด +20 และฟื้นเลือด 20' },
  magnet: { name:'แม่เหล็ก',   ic:'⊙', ds:'ระยะดูด ◆ +35' },
  regen:  { name:'ฟื้นฟู',     ic:'+', ds:'ฟื้น HP +0.4/วินาที' },
  armor:  { name:'เกราะ',      ic:'▣', ds:'ลดดาเมจที่ได้รับ 1 หน่วย' },
};

/* ---------- ศัตรู ---------- */
const ETYPES = {
  tri:  { hp:12,   sp:58, r:10, dmg:6,  xp:1,  color:'#ff5a6e', n:3 },
  pent: { hp:18,   sp:98, r:9,  dmg:6,  xp:2,  color:'#b57bff', n:5 },
  sq:   { hp:45,   sp:42, r:14, dmg:10, xp:3,  color:'#ff9f45', n:4 },
  boss: { hp:1400, sp:52, r:36, dmg:18, xp:40, color:'#ff3b3b', n:6 },
};
const WIN_TIME = 600;
const BOSS_TIMES = [180, 360, 540];

/* ---------- สถานะเกม ---------- */
let state = 'menu';       // menu | play | levelup | pause | over | win
let P, enemies, projs, gems, hearts, texts, parts, T, kills, spawnAcc, bossIdx, bossMsg, shake, pendingLv, camX, camY, levelChoices;

function newGame(){
  P = {
    x:0, y:0, r:12, hp:100, maxHp:100, lv:1, xp:0, xpNext:6, inv:0, face:0,
    w:{ wand:1 }, p:{},
    cd:{ wand:0, axe:0, aura:0 }, orbitA:0,
    dmgMul:1, spdMul:1, cdMul:1, magnet:70, regen:0, armor:0,
  };
  enemies = []; projs = []; gems = []; hearts = []; texts = []; parts = [];
  T = 0; kills = 0; spawnAcc = 0; bossIdx = 0; bossMsg = 0; shake = 0; pendingLv = 0;
  camX = 0; camY = 0;
}
newGame();

/* ---------- อินพุต ---------- */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if ((k === 'p' || k === 'escape') && !e.repeat){
    if (state === 'play') setPause(true); else if (state === 'pause') setPause(false);
  }
  if (state === 'levelup' && ['1','2','3'].includes(k)){
    const c = levelChoices[+k - 1]; if (c) pickChoice(c);
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') setPause(true); });

// จอยสติ๊กเสมือน (มือถือ/เมาส์)
const joy = { on:false, id:null, ox:0, oy:0, x:0, y:0 };
function joyStart(id, x, y){ joy.on = true; joy.id = id; joy.ox = joy.x = x; joy.oy = joy.y = y; }
function joyMove(x, y){ joy.x = x; joy.y = y; }
function joyEnd(){ joy.on = false; joy.id = null; }
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; if (!joy.on) joyStart(t.identifier, t.clientX, t.clientY); }, { passive:false });
cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === joy.id) joyMove(t.clientX, t.clientY); }, { passive:false });
cv.addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === joy.id) joyEnd(); });
cv.addEventListener('touchcancel', joyEnd);
cv.addEventListener('mousedown', e => joyStart('m', e.clientX, e.clientY));
addEventListener('mousemove', e => { if (joy.on && joy.id === 'm') joyMove(e.clientX, e.clientY); });
addEventListener('mouseup', () => { if (joy.id === 'm') joyEnd(); });

function inputVec(){
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  if (joy.on){
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
    if (d > 8){ x = dx / Math.max(d, 1); y = dy / Math.max(d, 1); if (d < 50){ x *= d / 50; y *= d / 50; } }
  }
  const l = Math.hypot(x, y);
  if (l > 1){ x /= l; y /= l; }
  return [x, y];
}

/* ---------- เมนู / overlay ---------- */
function show(id, v){ $(id).classList.toggle('show', v); }
function loadBest(){ try{ return JSON.parse(localStorage.getItem('shapeSurvivorBest')) || null; }catch(e){ return null; } }
function saveBest(){
  try{
    const b = loadBest();
    if (!b || T > b.time || (T >= WIN_TIME && kills > b.kills)) localStorage.setItem('shapeSurvivorBest', JSON.stringify({ time:T, kills, lv:P.lv }));
  }catch(e){}
}
function refreshBest(){
  const b = loadBest();
  $('bestTxt').textContent = b ? `สถิติดีที่สุด: อยู่รอด ${fmtTime(b.time)} · ฆ่า ${b.kills} ตัว · เลเวล ${b.lv}` : '';
}
refreshBest();

function startGame(){
  newGame(); state = 'play';
  show('menu', false); show('end', false); show('pause', false); show('levelup', false);
  beep(520, .12, 'triangle', .06);
}
function setPause(v){
  if (v && state === 'play'){ state = 'pause'; show('pause', true); }
  else if (!v && state === 'pause'){ state = 'play'; show('pause', false); }
}
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('resumeBtn').onclick = () => setPause(false);
$('quitBtn').onclick = () => { state = 'menu'; show('pause', false); show('menu', true); refreshBest(); };

function endGame(win){
  state = win ? 'win' : 'over';
  saveBest();
  $('endTitle').textContent = win ? '🏆 รอดครบ 10 นาที!' : '💀 คุณพ่ายแพ้';
  $('endTitle').style.color = win ? '#ffd447' : '#ff5a6e';
  $('endStats').innerHTML =
    `<div>เวลา <b>${fmtTime(T)}</b></div><div>เลเวล <b>${P.lv}</b></div>` +
    `<div>ฆ่าศัตรู <b>${kills}</b></div><div>อาวุธ <b>${Object.keys(P.w).length}</b></div>`;
  show('end', true);
  beep(win ? 880 : 110, .5, win ? 'triangle' : 'sawtooth', .08);
}

/* ---------- เลเวลอัป ---------- */
function buildChoices(){
  const pool = [];
  for (const k in WEAPONS){ const l = P.w[k] || 0; if (l < MAXLV) pool.push({ kind:'w', key:k, lv:l + 1 }); }
  for (const k in PASSIVES){ const l = P.p[k] || 0; if (l < MAXLV) pool.push({ kind:'p', key:k, lv:l + 1 }); }
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const out = pool.slice(0, 3);
  if (!out.length) out.push({ kind:'heal', key:'heal', lv:0 });
  return out;
}
function openLevelUp(){
  state = 'levelup';
  levelChoices = buildChoices();
  const box = $('choices'); box.innerHTML = '';
  levelChoices.forEach((c, i) => {
    const d = document.createElement('button'); d.className = 'choice';
    let ic, nm, ds, lv;
    if (c.kind === 'w'){ const w = WEAPONS[c.key]; ic = w.ic; nm = w.name; ds = w.ds; lv = c.lv === 1 ? 'อาวุธใหม่!' : `เลเวล ${c.lv}`; d.style.color = w.color; }
    else if (c.kind === 'p'){ const p = PASSIVES[c.key]; ic = p.ic; nm = p.name; ds = p.ds; lv = `เลเวล ${c.lv}`; }
    else { ic = '♥'; nm = 'ฟื้นฟู HP'; ds = 'ฟื้น HP 50'; lv = ''; }
    d.innerHTML = `<div class="ic">${ic}</div><div class="nm" style="color:var(--text)">${i + 1}. ${nm}</div><div class="lv">${lv}</div><div class="ds">${ds}</div>`;
    d.onclick = () => pickChoice(c);
    box.appendChild(d);
  });
  show('levelup', true);
  beep(660, .15, 'triangle', .07); setTimeout(() => beep(880, .2, 'triangle', .07, 'lv2', 0), 120);
}
function pickChoice(c){
  if (state !== 'levelup') return;
  if (c.kind === 'w') P.w[c.key] = c.lv;
  else if (c.kind === 'p'){
    P.p[c.key] = c.lv;
    switch (c.key){
      case 'might':  P.dmgMul += .15; break;
      case 'speed':  P.spdMul += .10; break;
      case 'cdr':    P.cdMul *= .92; break;
      case 'hp':     P.maxHp += 20; P.hp = Math.min(P.maxHp, P.hp + 20); break;
      case 'magnet': P.magnet += 35; break;
      case 'regen':  P.regen += .4; break;
      case 'armor':  P.armor += 1; break;
    }
  } else P.hp = Math.min(P.maxHp, P.hp + 50);
  pendingLv--;
  show('levelup', false);
  if (pendingLv > 0) openLevelUp(); else state = 'play';
}
function addXp(v){
  P.xp += v;
  while (P.xp >= P.xpNext){
    P.xp -= P.xpNext; P.lv++;
    P.xpNext = Math.floor(5 + P.lv * 5 + P.lv * P.lv * .6);
    pendingLv++;
  }
}

/* ---------- ศัตรู: spawn / ตาย / ดาเมจ ---------- */
function spawnEnemy(type, scale = 1){
  const t = ETYPES[type];
  const ang = Math.random() * Math.PI * 2;
  const d = Math.max(W, H) * .5 + 70;
  const hpScale = 1 + T / 110;
  enemies.push({
    type, x:P.x + Math.cos(ang) * d, y:P.y + Math.sin(ang) * d,
    hp:t.hp * hpScale * scale, maxHp:t.hp * hpScale * scale,
    sp:t.sp * (1 + Math.min(T / 900, .35)), r:t.r, dmg:t.dmg * (1 + T / 400), xp:t.xp,
    color:t.color, n:t.n, rot:Math.random() * 6.28, flash:0, ot:0, dead:false, boss:type === 'boss',
  });
}
function spawnBoss(){
  spawnEnemy('boss', 1 + bossIdx * 1.2);
  bossMsg = 3.5; shake = .5;
  beep(90, .6, 'sawtooth', .09, 'boss', 0);
}
function pickType(){
  const r = Math.random();
  if (T < 30) return 'tri';
  if (T < 70) return r < .65 ? 'tri' : 'pent';
  if (T < 150) return r < .4 ? 'tri' : r < .75 ? 'pent' : 'sq';
  return r < .25 ? 'tri' : r < .6 ? 'pent' : 'sq';
}
function floatText(x, y, s, color = '#fff'){
  if (texts.length > 80) texts.shift();
  texts.push({ x, y, s, color, life:.7 });
}
function burst(x, y, color, n = 6){
  if (parts.length > 250) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.28, s = rnd(40, 160);
    parts.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:rnd(.25, .5), color, r:rnd(2, 4) });
  }
}
function hurt(e, d, kx = 0, ky = 0){
  if (e.dead) return;
  d *= P.dmgMul;
  e.hp -= d; e.flash = .08;
  if (!e.boss){ e.x += kx; e.y += ky; }
  floatText(e.x, e.y - e.r, Math.round(d), '#fff');
  beep(220 + Math.random() * 60, .04, 'square', .025, 'hit', .04);
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true; kills++;
  burst(e.x, e.y, e.color, e.boss ? 30 : 7);
  gems.push({ x:e.x, y:e.y, v:e.xp, pull:false });
  if (e.boss){ hearts.push({ x:e.x + 14, y:e.y }); shake = .4; beep(70, .4, 'sawtooth', .09, 'bossdie', 0); }
  else if (Math.random() < .006) hearts.push({ x:e.x, y:e.y });
}

/* ---------- อาวุธ ---------- */
function nearestEnemies(n){
  const arr = [];
  for (const e of enemies){
    if (e.dead) continue;
    const dx = e.x - P.x, dy = e.y - P.y, d2 = dx * dx + dy * dy;
    if (d2 < 600 * 600) arr.push({ e, d2 });
  }
  arr.sort((a, b) => a.d2 - b.d2);
  return arr.slice(0, n).map(o => o.e);
}
function updateWeapons(dt){
  // ไม้เวท
  if (P.w.wand){
    const l = P.w.wand;
    P.cd.wand -= dt;
    if (P.cd.wand <= 0){
      const cnt = [0, 1, 2, 2, 3, 4][l], targets = nearestEnemies(cnt);
      if (targets.length){
        P.cd.wand = (0.95 - .08 * l) * P.cdMul;
        for (let i = 0; i < cnt; i++){
          const tg = targets[i % targets.length];
          let a = Math.atan2(tg.y - P.y, tg.x - P.x);
          if (i >= targets.length) a += rnd(-.35, .35);
          projs.push({ k:'wand', x:P.x, y:P.y, vx:Math.cos(a) * 400, vy:Math.sin(a) * 400, r:5, dmg:10 + 3 * l, pierce:l >= 4 ? 2 : 1, life:1.6, hit:null });
        }
        beep(700, .05, 'triangle', .03, 'wand', .06);
      } else P.cd.wand = .15;
    }
  }
  // ขวาน
  if (P.w.axe){
    const l = P.w.axe;
    P.cd.axe -= dt;
    if (P.cd.axe <= 0){
      P.cd.axe = (1.8 - .12 * l) * P.cdMul;
      const cnt = [0, 1, 1, 2, 2, 3][l];
      for (let i = 0; i < cnt; i++)
        projs.push({ k:'axe', x:P.x, y:P.y, vx:rnd(-110, 110), vy:-440 - i * 40, r:11, dmg:20 + 6 * l, life:2.4, rot:0, hit:new Set() });
      beep(300, .08, 'sawtooth', .03, 'axe', .1);
    }
  }
  // ใบมีดหมุน
  if (P.w.orbit){
    const l = P.w.orbit, n = [0, 2, 3, 3, 4, 5][l], R = 62 + l * 5, sp = 2.4 + .35 * l;
    P.orbitA += sp * dt;
    for (let i = 0; i < n; i++){
      const a = P.orbitA + i / n * Math.PI * 2, bx = P.x + Math.cos(a) * R, by = P.y + Math.sin(a) * R;
      for (const e of enemies){
        if (e.dead || e.ot > 0) continue;
        const dx = e.x - bx, dy = e.y - by, rr = e.r + 9;
        if (dx * dx + dy * dy < rr * rr){
          e.ot = .35;
          const d = Math.hypot(dx, dy) || 1;
          hurt(e, 8 + 2 * l, dx / d * 8, dy / d * 8);
        }
      }
    }
  }
  // ออร่า
  if (P.w.aura){
    const l = P.w.aura, R = [0, 70, 85, 100, 115, 135][l];
    P.cd.aura -= dt;
    if (P.cd.aura <= 0){
      P.cd.aura = .5 * P.cdMul;
      for (const e of enemies){
        if (e.dead) continue;
        const dx = e.x - P.x, dy = e.y - P.y, rr = R + e.r;
        if (dx * dx + dy * dy < rr * rr){
          const d = Math.hypot(dx, dy) || 1;
          hurt(e, 4 + 2 * l, dx / d * 3, dy / d * 3);
        }
      }
      P.auraPulse = .25;
    }
  }
}
function updateProjs(dt){
  for (const p of projs){
    p.life -= dt;
    if (p.k === 'axe'){ p.vy += 780 * dt; p.rot += 10 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    for (const e of enemies){
      if (e.dead) continue;
      const dx = e.x - p.x, dy = e.y - p.y, rr = e.r + p.r;
      if (dx * dx + dy * dy > rr * rr) continue;
      if (p.k === 'axe'){
        if (p.hit.has(e)) continue;
        p.hit.add(e); hurt(e, p.dmg);
      } else {
        if (p.hit === e) continue;
        const d = Math.hypot(dx, dy) || 1;
        hurt(e, p.dmg, dx / d * 5, dy / d * 5);
        p.hit = e; p.pierce--;
        if (p.pierce <= 0){ p.life = 0; break; }
      }
    }
  }
  projs = projs.filter(p => p.life > 0);
}

/* ---------- อัปเดตหลัก ---------- */
function update(dt){
  T += dt;
  if (T >= WIN_TIME){ endGame(true); return; }

  // ผู้เล่น
  const [ix, iy] = inputVec();
  const sp = 150 * P.spdMul;
  P.x += ix * sp * dt; P.y += iy * sp * dt;
  if (ix || iy) P.face = Math.atan2(iy, ix);
  P.inv = Math.max(0, P.inv - dt);
  if (P.regen) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
  if (P.auraPulse) P.auraPulse = Math.max(0, P.auraPulse - dt);

  // spawn
  if (bossIdx < BOSS_TIMES.length && T >= BOSS_TIMES[bossIdx]){ spawnBoss(); bossIdx++; }
  const alive = enemies.length;
  const interval = Math.max(.1, .75 - T * .0009);
  spawnAcc += dt;
  while (spawnAcc >= interval){
    spawnAcc -= interval;
    if (alive < 380){
      const burstN = 1 + Math.floor(T / 90);
      for (let i = 0; i < burstN; i++) spawnEnemy(pickType());
    }
  }

  // ศัตรู
  const grid = new Map(), CS = 36;
  for (const e of enemies){
    e.ot = Math.max(0, e.ot - dt); e.flash = Math.max(0, e.flash - dt);
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += dx / d * e.sp * dt; e.y += dy / d * e.sp * dt;
    e.rot += dt * (e.boss ? .6 : 1.2);
    const key = Math.floor(e.x / CS) * 100003 + Math.floor(e.y / CS);
    let cell = grid.get(key); if (!cell){ cell = []; grid.set(key, cell); } cell.push(e);
  }
  for (const e of enemies){
    if (e.boss) continue;
    const cx = Math.floor(e.x / CS), cy = Math.floor(e.y / CS);
    for (let gx = cx - 1; gx <= cx + 1; gx++) for (let gy = cy - 1; gy <= cy + 1; gy++){
      const cell = grid.get(gx * 100003 + gy); if (!cell) continue;
      for (const o of cell){
        if (o === e) continue;
        const dx = e.x - o.x, dy = e.y - o.y, rr = (e.r + o.r) * .8, d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > .01){
          const d = Math.sqrt(d2), push = (rr - d) * .5;
          e.x += dx / d * push; e.y += dy / d * push;
        }
      }
    }
    // ชนผู้เล่น
  }
  for (const e of enemies){
    const dx = P.x - e.x, dy = P.y - e.y, rr = P.r + e.r - 2;
    if (dx * dx + dy * dy < rr * rr && P.inv <= 0){
      const d = Math.max(1, Math.round(e.dmg) - P.armor);
      P.hp -= d; P.inv = .45; shake = Math.max(shake, .15);
      floatText(P.x, P.y - 18, '-' + d, '#ff5a6e');
      beep(130, .12, 'sawtooth', .06, 'ouch', .1);
      if (P.hp <= 0){ P.hp = 0; endGame(false); return; }
    }
  }

  updateWeapons(dt);
  updateProjs(dt);
  enemies = enemies.filter(e => !e.dead);

  // เจม
  if (gems.length > 450){ const g = gems.splice(0, 100); addXp(g.reduce((s, x) => s + x.v, 0)); }
  for (const g of gems){
    const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < P.magnet) g.pull = true;
    if (g.pull){ const s = 260 + (P.magnet - Math.min(d, P.magnet)) * 2 + 120; g.x += dx / d * s * dt; g.y += dy / d * s * dt; }
    if (d < P.r + 6){ g.got = true; addXp(g.v); beep(900 + Math.min(g.v, 10) * 40, .04, 'sine', .03, 'gem', .03); }
  }
  gems = gems.filter(g => !g.got);
  // หัวใจ
  for (const h of hearts){
    const dx = P.x - h.x, dy = P.y - h.y;
    if (dx * dx + dy * dy < (P.r + 12) ** 2){ h.got = true; P.hp = Math.min(P.maxHp, P.hp + 30); floatText(P.x, P.y - 18, '+30', '#7dff9b'); beep(600, .15, 'triangle', .06); }
  }
  hearts = hearts.filter(h => !h.got);

  // เอฟเฟกต์
  for (const t of texts){ t.life -= dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.life > 0);
  for (const p of parts){ p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .93; p.vy *= .93; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);
  bossMsg = Math.max(0, bossMsg - dt);

  if (pendingLv > 0) openLevelUp();
}

/* ---------- วาด ---------- */
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#12141c'; ctx.fillRect(0, 0, W, H);

  // กล้องตามผู้เล่น
  camX += (P.x - camX) * .15; camY += (P.y - camY) * .15;
  let sx = 0, sy = 0;
  if (shake > 0){ sx = rnd(-1, 1) * shake * 14; sy = rnd(-1, 1) * shake * 14; }
  const ox = W / 2 - camX + sx, oy = H / 2 - camY + sy;

  // พื้นหลังกริด
  const G = 80, x0 = Math.floor((camX - W / 2) / G) * G, y0 = Math.floor((camY - H / 2) / G) * G;
  ctx.strokeStyle = '#1b1f2e'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = x0; x < camX + W / 2 + G; x += G){ ctx.moveTo(x + ox, 0); ctx.lineTo(x + ox, H); }
  for (let y = y0; y < camY + H / 2 + G; y += G){ ctx.moveTo(0, y + oy); ctx.lineTo(W, y + oy); }
  ctx.stroke();

  ctx.save(); ctx.translate(ox, oy);
  const vx0 = camX - W / 2 - 60, vx1 = camX + W / 2 + 60, vy0 = camY - H / 2 - 60, vy1 = camY + H / 2 + 60;
  const vis = o => o.x > vx0 && o.x < vx1 && o.y > vy0 && o.y < vy1;

  // ออร่า
  if (P.w.aura){
    const R = [0, 70, 85, 100, 115, 135][P.w.aura], pulse = P.auraPulse || 0;
    ctx.fillStyle = `rgba(255,143,208,${.07 + pulse * .25})`;
    ctx.strokeStyle = `rgba(255,143,208,${.35 + pulse})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, 6.283); ctx.fill(); ctx.stroke();
  }

  // หัวใจ
  for (const h of hearts){
    if (!vis(h)) continue;
    ctx.fillStyle = '#7dff9b'; ctx.fillRect(h.x - 4, h.y - 10, 8, 20); ctx.fillRect(h.x - 10, h.y - 4, 20, 8);
  }
  // เจม
  for (const g of gems){
    if (!vis(g)) continue;
    ctx.fillStyle = g.v >= 10 ? '#ffd447' : g.v >= 3 ? '#7dffb3' : '#5fb8ff';
    poly(g.x, g.y, 5 + Math.min(g.v, 8) * .4, 4, Math.PI / 4); ctx.fill();
  }
  // ศัตรู
  for (const e of enemies){
    if (!vis(e)) continue;
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
    poly(e.x, e.y, e.r, e.n, e.rot); ctx.fill();
    if (e.boss){
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      const bw = 80; ctx.fillStyle = '#000a'; ctx.fillRect(e.x - bw / 2, e.y - e.r - 14, bw, 6);
      ctx.fillStyle = '#ff3b3b'; ctx.fillRect(e.x - bw / 2, e.y - e.r - 14, bw * Math.max(0, e.hp / e.maxHp), 6);
    }
  }
  // ใบมีด
  if (P.w.orbit){
    const l = P.w.orbit, n = [0, 2, 3, 3, 4, 5][l], R = 62 + l * 5;
    ctx.fillStyle = '#c4f27a';
    for (let i = 0; i < n; i++){
      const a = P.orbitA + i / n * 6.283;
      poly(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R, 10, 3, a * 2); ctx.fill();
    }
  }
  // กระสุน
  for (const p of projs){
    if (p.k === 'wand'){
      ctx.fillStyle = '#6ee7ff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#6ee7ff55'; ctx.beginPath(); ctx.arc(p.x - p.vx * .02, p.y - p.vy * .02, p.r * .8, 0, 6.283); ctx.fill();
    } else {
      ctx.fillStyle = '#ffb347'; poly(p.x, p.y, p.r + 3, 3, p.rot); ctx.fill();
    }
  }
  // ผู้เล่น
  ctx.globalAlpha = P.inv > 0 && Math.floor(P.inv * 20) % 2 ? .4 : 1;
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#4a7dff'; poly(P.x + Math.cos(P.face) * 6, P.y + Math.sin(P.face) * 6, 6, 3, P.face); ctx.fill();
  ctx.globalAlpha = 1;
  // อนุภาค
  for (const p of parts){ ctx.globalAlpha = clamp(p.life * 3, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
  ctx.globalAlpha = 1;
  // ตัวเลขดาเมจ
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  for (const t of texts){ ctx.globalAlpha = clamp(t.life * 2, 0, 1); ctx.fillStyle = t.color; ctx.fillText(t.s, t.x, t.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD();
}

function drawHUD(){
  // XP bar
  ctx.fillStyle = '#0008'; ctx.fillRect(0, 0, W, 16);
  ctx.fillStyle = '#5fb8ff'; ctx.fillRect(0, 0, W * clamp(P.xp / P.xpNext, 0, 1), 16);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('LV ' + P.lv, W - 8, 12);

  // เวลา
  ctx.textAlign = 'center'; ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(fmtTime(T), W / 2, 48);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#8d93ad';
  ctx.fillText('เป้าหมาย 10:00', W / 2, 64);

  // HP
  const bw = Math.min(220, W * .4);
  ctx.fillStyle = '#0008'; ctx.fillRect(10, 26, bw, 14);
  ctx.fillStyle = P.hp / P.maxHp < .3 ? '#ff5a6e' : '#e8434f'; ctx.fillRect(10, 26, bw * clamp(P.hp / P.maxHp, 0, 1), 14);
  ctx.strokeStyle = '#fff4'; ctx.lineWidth = 1; ctx.strokeRect(10.5, 26.5, bw, 14);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`HP ${Math.ceil(P.hp)}/${P.maxHp}`, 16, 37);

  // อาวุธ
  let x = 10;
  ctx.font = 'bold 13px sans-serif';
  for (const k in P.w){
    ctx.fillStyle = WEAPONS[k].color; ctx.fillText(`${WEAPONS[k].ic} ${P.w[k]}`, x, 60); x += 46;
  }
  // kills
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
  ctx.fillText('☠ ' + kills, W - 10, 36);

  // boss warning
  if (bossMsg > 0){
    ctx.textAlign = 'center'; ctx.globalAlpha = Math.min(1, bossMsg) * (Math.floor(bossMsg * 6) % 2 ? .6 : 1);
    ctx.fillStyle = '#ff3b3b'; ctx.font = 'bold 36px sans-serif';
    ctx.fillText('⚠ BOSS มาแล้ว! ⚠', W / 2, H * .28);
    ctx.globalAlpha = 1;
  }
  // จอยสติ๊ก
  if (joy.on){
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, 6.283); ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), k = d > 50 ? 50 / d : 1;
    ctx.fillStyle = '#ffffff88'; ctx.beginPath(); ctx.arc(joy.ox + dx * k, joy.oy + dy * k, 20, 0, 6.283); ctx.fill();
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
